<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="15" />
  <title>Migration en cours — Lab BTP</title>
  <style>
    :root {
      color-scheme: light;
      --brand-red: #dc2e31;
      --brand-navy: #1f2445;
      --brand-blue: #30358c;
      --surface: #f4f6fb;
      --card: #ffffff;
      --muted: #5c6478;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(220, 46, 49, 0.08), transparent 42%),
        linear-gradient(180deg, #ffffff 0%, var(--surface) 100%);
      color: var(--brand-navy);
    }

    .panel {
      width: min(100%, 32rem);
      padding: 2.25rem 2rem;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(31, 36, 69, 0.08);
      text-align: center;
    }

    .logo {
      width: min(100%, 14rem);
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
    }

    .spinner {
      width: 2.75rem;
      height: 2.75rem;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(48, 53, 140, 0.15);
      border-top-color: var(--brand-red);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      line-height: 1.2;
      font-weight: 700;
      color: var(--brand-blue);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    .hint {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.92rem;
    }

    code {
      font-size: 0.85em;
      background: var(--surface);
      padding: 0.12rem 0.35rem;
      border-radius: 0.35rem;
    }
  </style>
</head>
<body>
  <main class="panel" role="main" aria-live="polite">
    <img class="logo" src="/logo-vertical.svg" alt="Lab BTP" width="224" height="55" />
    <div class="spinner" aria-hidden="true"></div>
    <h1>Migration en cours</h1>
    <p>
      La plateforme est momentanément indisponible pendant une mise à jour.
      Merci de patienter quelques instants.
    </p>
    <p class="hint">
      Cette page se rafraîchit automatiquement toutes les <code>15</code> secondes.
    </p>
  </main>
</body>
</html>
